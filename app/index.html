<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>archemapa</title>
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <meta name="googlebot" content="noindex, nofollow" />
  <meta name="theme-color" content="#2b2f36" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app"></div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/georef.js"></script>
  <script src="js/overlay-layer.js"></script>
  <script src="js/db.js"></script>
  <script src="js/home.js"></script>
  <script src="js/calibrate.js"></script>
  <script src="js/field.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Powiadamia o nowej wersji appki zamiast po cichu serwować starą w
    // nieskończoność (patrz historia — cache-first potrafił "zaklinować"
    // starą wersję na urządzeniu na dłużej, nawet po redeployu).
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker
          .register('sw.js')
          .then((reg) => {
            document.addEventListener('visibilitychange', () => {
              if (document.visibilityState === 'visible') reg.update();
            });
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              if (!newWorker) return;
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  showUpdateBanner();
                }
              });
            });
          })
          .catch((err) => {
            console.warn('Service worker nie zarejestrował się:', err);
          });
      });
    }

    function showUpdateBanner() {
      if (document.getElementById('update-banner')) return;
      const bar = document.createElement('div');
      bar.id = 'update-banner';
      bar.innerHTML = '<span>Dostępna nowa wersja appki</span><button id="update-reload">Odśwież</button>';
      document.getElementById('app').appendChild(bar);
      document.getElementById('update-reload').onclick = () => location.reload();
    }
  </script>
</body>
</html>
